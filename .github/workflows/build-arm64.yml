name: Build arm64 Docker Image

on:
  release:
    types: [published]
  workflow_dispatch:  # Manuell triggern

jobs:
  build:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION="latest"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build and push Immich Server (arm64)
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/immich-server:${{ steps.version.outputs.version }}-arm64
            ${{ secrets.DOCKER_USERNAME }}/immich-server:arm64-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Immich Web (arm64)
        uses: docker/build-push-action@v5
        with:
          context: ./web
          file: ./web/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/immich-web:${{ steps.version.outputs.version }}-arm64
            ${{ secrets.DOCKER_USERNAME }}/immich-web:arm64-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Immich ML (arm64)
        uses: docker/build-push-action@v5
        with:
          context: ./machine-learning
          file: ./machine-learning/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/immich-machine-learning:${{ steps.version.outputs.version }}-arm64
            ${{ secrets.DOCKER_USERNAME }}/immich-machine-learning:arm64-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
